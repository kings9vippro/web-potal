<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bắt Cầu — Anh Khôi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>body { font-family: 'Inter', sans-serif; background: #0A0F1D; color: #F8FAFC; } [x-cloak] { display: none !important; }</style>
</head>
<body x-data="adminApp()" x-cloak class="min-h-screen flex flex-col p-4 sm:p-8">

    <!-- Form xác thực Admin -->
    <div x-show="!auth" class="max-w-sm mx-auto w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl text-center mt-20">
        <h2 class="text-xl font-bold font-['Plus_Jakarta_Sans'] mb-4">Cổng Quản Trị Server</h2>
        <input type="password" x-model="pin" placeholder="Nhập Secret PIN..." class="w-full h-12 px-4 rounded-xl bg-black border border-slate-800 mb-4 text-center">
        <button @click="login()" class="w-full h-12 bg-blue-600 text-white font-bold rounded-xl">Xác Nhận</button>
    </div>

    <!-- Bảng Quản Trị -->
    <div x-show="auth" class="max-w-5xl mx-auto w-full bg-slate-900 border border-slate-800 p-6 rounded-3xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold font-['Plus_Jakarta_Sans']">Quản Lý Key & Tài Khoản</h1>
            <button @click="auth = false" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-lg text-sm">Thoát</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="bg-black/50 p-5 rounded-2xl border border-slate-800">
                <h3 class="font-bold mb-3 text-sm text-slate-400">Tạo Mã Key Mới (Tự đếm ngược khi KH nhập)</h3>
                <div class="flex gap-2">
                    <select x-model="keyTime" class="h-11 px-3 rounded-xl bg-slate-900 border border-slate-700 text-sm flex-1">
                        <option value="1 Giờ">Key 1 Giờ</option>
                        <option value="24 Giờ">Key 24 Giờ (1 Ngày)</option>
                        <option value="7 Ngày">Key 7 Ngày</option>
                        <option value="30 Ngày">Key 30 Ngày</option>
                        <option value="Vô Hạn">Vĩnh Viễn</option>
                    </select>
                    <button @click="createKey()" class="px-6 bg-amber-500 hover:bg-amber-600 text-amber-950 font-bold rounded-xl text-sm transition-colors">Tạo Key</button>
                </div>
            </div>
            <div class="bg-black/50 p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                <div>
                    <h3 class="font-bold mb-1 text-sm text-slate-400">Tổng Số Tài Khoản</h3>
                    <p class="text-3xl font-mono font-bold text-blue-400" x-text="users.length"></p>
                </div>
                <button @click="fetchData()" class="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center text-xl"><i class="ri-refresh-line"></i></button>
            </div>
        </div>

        <!-- Bảng Danh sách Key -->
        <h3 class="font-bold mb-3 text-sm text-slate-400">Danh Sách Mã Key</h3>
        <div class="overflow-x-auto bg-black rounded-xl border border-slate-800 mb-6">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-900 text-slate-500">
                    <tr><th class="p-3">Mã Key</th><th class="p-3">Thời Hạn</th><th class="p-3">Trạng Thái</th><th class="p-3">Người Dùng</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-800 font-mono">
                    <template x-for="k in keys" :key="k.code">
                        <tr>
                            <td class="p-3 text-amber-400 font-bold" x-text="k.code"></td>
                            <td class="p-3 text-slate-300" x-text="k.duration"></td>
                            <td class="p-3">
                                <span class="px-2 py-0.5 rounded text-[10px]" :class="k.isUsed ? 'bg-slate-800 text-slate-500' : 'bg-emerald-500/20 text-emerald-400'" x-text="k.isUsed ? 'Đã kích hoạt' : 'Chưa dùng'"></span>
                            </td>
                            <td class="p-3 text-blue-400" x-text="k.usedBy || '-'"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function adminApp() {
            return {
                auth: false, pin: '', users: [], keys: [], keyTime: '24 Giờ',
                login() {
                    if(this.pin === 'AnhKhoi2026') { this.auth = true; this.fetchData(); }
                    else Swal.fire('Lỗi', 'Sai mã PIN', 'error');
                },
                async fetchData() {
                    const res = await fetch('/api/admin/overview', { headers: { 'x-admin-key': this.pin } });
                    const data = await res.json();
                    if(data.status === 'success') { this.users = data.users; this.keys = data.keys; }
                },
                async createKey() {
                    const res = await fetch('/api/admin/keys/create', {
                        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': this.pin },
                        body: JSON.stringify({ vipName: 'Gói VIP Tool', duration: this.keyTime, count: 1 })
                    });
                    const data = await res.json();
                    if(data.status === 'success') { Swal.fire('Thành công', data.message, 'success'); this.fetchData(); }
                }
            }
        }
    </script>
</body>
</html>
